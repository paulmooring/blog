# Site settings
title: Paul's Tech Blog
tagline: My thoughts on tech, software development, and AI.
email: pmooring@outlook.com
description: >-
  A tech blog about software engineering, infrastructure and AI.
author: Paul Mooring
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://blog.pwm.gg" # the base hostname & protocol, e.g. https://example.com

# Social / profile links (leave blank to hide)
github_username: pmooring
linkedin_username: "pmooring"

# Author profile (shown in the bio box at the foot of each post)
author_profile:
  name: Paul Mooring
  avatar: /assets/images/avatar.svg
  bio: >-
    Engineer writing about software, infrastructure, and AI. These are my notes
    from building things.

# Fallback cover image used when a post has no `image:` in its front matter.
default_cover: /assets/images/cover-default.svg

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

# Syntax highlighting
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Header navigation
nav:
  - title: Home
    url: /
  - title: About
    url: /about/
  - title: Archive
    url: /archive/

# Default front matter
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: page

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - README.md
  - .sass-cache/
  - .jekyll-cache/
  - node_modules/
