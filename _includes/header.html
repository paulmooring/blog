<header class="site-header">
  <div class="wrapper site-header__inner">
    <a class="site-header__brand" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>

    <nav class="site-nav" aria-label="Primary">
      <button class="site-nav__toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="nav-links">
        <span class="site-nav__bars"></span>
      </button>
      <ul class="site-nav__links" id="nav-links">
        {%- for item in site.nav -%}
        <li>
          <a href="{{ item.url | relative_url }}"
             {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.title }}</a>
        </li>
        {%- endfor -%}
      </ul>
    </nav>

    <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle theme">
      <svg class="theme-toggle__sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
      </svg>
      <svg class="theme-toggle__moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
  </div>
</header>
